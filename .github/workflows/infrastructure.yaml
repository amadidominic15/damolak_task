name: ShopLite Infrastructure CI/CD
on:
  push:
    branches:
      - main
    paths:
      - "*.tf"
      - "*.tfvars"
      - "modules/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.tf"
      - "*.tfvars"
      - "modules/**"
      - ".github/workflows/infrastructure.yml"

  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: shoplite-production-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: Terraform Scan and Infrastructure Provision
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Trivy
        uses: aquasecurity/trivy-action@master
        with:
          cache: true
          scan-type: config
          scan-ref: terraform/
          format: table
          exit-code: "0" #exit-code: 1 stops your pipeline till all severity listed are passed
          severity: HIGH,CRITICAL
          ignore-unfixed: false


      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"          

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform initialize
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'pull_request'
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan